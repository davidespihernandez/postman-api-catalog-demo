# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
instances:
  - url: https://postman-api-catalog-demo.docs.buildwithfern.com
title: Postman API Catalog Demo | Documentation
favicon: ./assets/favicon.svg
logo:
  light: ./assets/logo-light.svg
  dark: ./assets/logo-dark.svg
  height: 26
  href: /
landing-page:
  page: Home
  path: ./pages/home.mdx
tabs:
  guides:
    display-name: Guides
    icon: fa-solid fa-book
  api:
    display-name: API Reference
    icon: fa-solid fa-code
navigation:
  - tab: guides
    layout:
      - section: Getting started
        contents:
          - page: Introduction
            path: ./pages/introduction.mdx
          - page: Payment refund webhook
            path: ./pages/webhooks.mdx
          - page: Async notifications (MQTT)
            path: ./pages/mqtt.mdx
  - tab: api
    layout:
      - api: Orders API
        api-name: orders
      - api: Payments API
        api-name: payments
      - api: Users API
        api-name: users
navbar-links:
  - type: minimal
    text: Postman workspace
    url: https://www.postman.com/
  - type: filled
    text: Live API
    url: https://18-157-170-15.nip.io/health
layout:
  searchbar-placement: header
  tabs-placement: header
  header-height: 64px
colors:
  accent-primary:
    light: '#C2410C'
    dark: '#FF8A5B'
  background:
    light: '#ffffff'
    dark: '#0b0b0b'
