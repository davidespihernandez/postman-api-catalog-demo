$kind: http-example
request:
  url: "{{baseUrl}}/orders/:id"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: id
      value: ord-001
      description: Order identifier
  body:
    type: json
    content: |-
      {
        "customerId": "usr-003",
        "total": 149.99,
        "status": "processing",
        "currency": "EUR"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "ord-001",
        "customerId": "usr-003",
        "status": "processing",
        "total": 149.99,
        "currency": "EUR"
      }
order: 1000
