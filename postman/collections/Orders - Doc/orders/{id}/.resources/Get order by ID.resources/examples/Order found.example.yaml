$kind: http-example
request:
  url: "{{baseUrl}}/orders/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: ord-001
      description: Order identifier
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "ord-001",
        "customerId": "usr-001",
        "status": "shipped",
        "total": 49.99,
        "currency": "USD"
      }
order: 1000
