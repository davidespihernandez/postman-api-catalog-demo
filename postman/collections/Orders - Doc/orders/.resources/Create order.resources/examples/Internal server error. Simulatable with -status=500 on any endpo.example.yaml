$kind: http-example
name: Internal server error. Simulatable with ?status=500 on any endpoint except /openapi.json.
request:
  url: "{{baseUrl}}/orders"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "customerId": "usr-002",
        "total": 99.5,
        "status": "pending",
        "currency": "USD"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Simulated response for API Catalog demo",
        "status": 500,
        "simulated": true,
        "service": "orders-api",
        "delayMs": 2000
      }
order: 3000
