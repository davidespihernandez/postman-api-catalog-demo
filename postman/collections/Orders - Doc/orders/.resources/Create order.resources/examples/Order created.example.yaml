$kind: http-example
request:
  url: "{{baseUrl}}/orders"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "customerId": "usr-002",
        "total": 99.5,
        "status": "pending",
        "currency": "USD"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "ord-a1b2c3d4",
        "customerId": "usr-002",
        "status": "pending",
        "total": 99.5,
        "currency": "USD"
      }
order: 1000
