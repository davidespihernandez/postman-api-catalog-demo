$kind: http-request
url: "{{baseUrl}}/orders/{{order_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const orderId = pm.iterationData.get("order_id");
      const expected = pm.iterationData.get("expected");
      // Compare as strings so it works whether the data source gives the code as
      // a string (cloud dataset) or a number (CSV via -d, which coerces "200" -> 200).
      pm.test("Expected response code is returned", function () {
          pm.expect(String(pm.response.code)).to.eql(String(expected));
      });
    language: text/javascript
order: 1000
