$kind: http-example
request:
  url: "{{baseUrl}}/users/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: usr-001
      description: User identifier
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "usr-001",
        "name": "Alice Chen",
        "email": "alice@example.com",
        "role": "customer"
      }
order: 1000
