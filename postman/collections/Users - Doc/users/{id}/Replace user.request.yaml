$kind: http-request
url: "{{baseUrl}}/users/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: usr-001
    description: User identifier
body:
  type: json
  content: |-
    {
      "name": "QA Updated User",
      "email": "qa.updated@example.com",
      "role": "customer"
    }
settings: {}
examples: ./.resources/Replace user.resources/examples
order: 2000
