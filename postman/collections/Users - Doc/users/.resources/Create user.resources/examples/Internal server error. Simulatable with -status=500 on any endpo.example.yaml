$kind: http-example
name: Internal server error. Simulatable with ?status=500 on any endpoint except /openapi.json.
request:
  url: "{{baseUrl}}/users"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "QA Test User",
        "email": "qa.test@example.com",
        "role": "customer"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Simulated response for API Catalog demo",
        "status": 500,
        "simulated": true,
        "service": "users-api",
        "delayMs": 9930
      }
order: 3000
