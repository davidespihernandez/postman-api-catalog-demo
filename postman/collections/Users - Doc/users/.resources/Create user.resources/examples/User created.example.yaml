$kind: http-example
request:
  url: "{{baseUrl}}/users"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "QA Test User",
        "email": "qa.test@example.com",
        "role": "customer"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "usr-001",
        "name": "Alice Chen",
        "email": "alice@example.com",
        "role": "customer"
      }
order: 1000
