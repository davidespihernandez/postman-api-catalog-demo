$kind: http-example
request:
  url: "{{baseUrl}}/users"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "usr-001",
            "name": "Alice Chen",
            "email": "alice@example.com",
            "role": "customer"
          }
        ],
        "count": 1
      }
order: 1000
