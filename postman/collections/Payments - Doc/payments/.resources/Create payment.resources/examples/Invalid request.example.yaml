$kind: http-example
request:
  url: "{{baseUrl}}/payments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "orderId": "ord-001",
        "amount": 49.99,
        "status": "completed",
        "currency": "USD"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Payment not found",
        "service": "payments-api"
      }
order: 2000
