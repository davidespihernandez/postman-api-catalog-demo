$kind: http-example
request:
  url: "{{baseUrl}}/payments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "orderId": "ord-001",
        "amount": 49.99,
        "status": "completed",
        "currency": "USD"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "pay-001",
        "orderId": "ord-001",
        "amount": 49.99,
        "status": "completed",
        "currency": "USD",
        "refundReason": "customer_request",
        "refundedAt": "1969-06-15T07:36:36.112Z"
      }
order: 1000
