$kind: http-request
description: Refunds a payment by ID. On success, the Payments service asynchronously publishes a `payment.refunded` event to the external **Payment Refund Webhook API** (not part of this backend).
url: "{{baseUrl}}/payments/refund"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "paymentId": "pay-001",
      "reason": "customer_request"
    }
settings: {}
examples: ./.resources/Refund a payment.resources/examples
order: 1000
