$kind: http-example
request:
  url: "{{baseUrl}}/payments/:id"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: pay-001
      description: Payment identifier
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Payment not found",
        "service": "payments-api"
      }
order: 2000
