$kind: http-example
name: Internal server error. Simulatable with ?status=500 on any endpoint except /openapi.json.
request:
  url: "{{baseUrl}}/payments/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: pay-001
      description: Payment identifier
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Simulated response for API Catalog demo",
        "status": 500,
        "simulated": true,
        "service": "payments-api",
        "delayMs": 6350
      }
order: 3000
