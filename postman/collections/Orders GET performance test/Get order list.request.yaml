$kind: http-request
url: "{{baseUrl}}/orders"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('Response data is a list', function () {
        pm.expect(body.data).to.be.an('array');
      });
      pm.test('Data length equals count', function () {
        pm.expect(body.data.length).to.eql(body.count);
      });
    language: text/javascript
order: 1000
