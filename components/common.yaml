{
  "components": {
    "schemas": {
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string",
            "example": "Resource not found"
          },
          "service": {
            "type": "string",
            "example": "retail-commerce-api"
          }
        }
      },
      "ServerErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string",
            "example": "Simulated response for API Catalog demo"
          },
          "status": {
            "type": "integer",
            "example": 500
          },
          "simulated": {
            "type": "boolean",
            "example": true
          },
          "service": {
            "type": "string",
            "example": "retail-commerce-api"
          },
          "delayMs": {
            "type": "integer",
            "example": 2000
          }
        }
      }
    },
    "responses": {
      "InternalServerError": {
        "description": "Internal server error. Simulatable with ?status=500 on any endpoint except /openapi.json.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ServerErrorResponse"
            }
          }
        }
      }
    }
  }
}
