# Real CI/CD pipeline — Postman local (git) is the source of truth.
#   PR -> main : spec lint + QA against the FRESHLY-BUILT code (gate; a breaking change
#                fails here, so it can't be merged/deployed)
#   push main  : same gate, then sync local->Postman Cloud, deploy to AWS, post-deploy smoke
#   Deploy only runs if the test gate passes (release job `needs: test`).
#
# Requires: repo secret POSTMAN_API_KEY (already set). AWS access via GitHub OIDC
# (role github-actions-postman-deploy, no stored keys). See README.md.

name: API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  ORDERS_QA_COLLECTION: 53522859-54ec8184-2939-4cef-8528-56e1936bbae5
  AWS_ORDERS_ENV: 53522859-9577f7c6-d8c7-4375-bf19-85b17e418c33   # Orders Production (AWS)
  AWS_HOST: 18-157-170-15.nip.io
  AWS_REGION: eu-central-1
  AWS_INSTANCE_ID: i-0b7891fda81d7e646
  DEPLOY_ROLE: arn:aws:iam::005904641462:role/github-actions-postman-deploy

jobs:
  test:
    name: Lint + QA (freshly-built code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Spec lint (local specs — the Spec Hub source of truth)
        run: |
          for f in orders.yaml payments.yaml users.yaml; do
            echo "== lint $f =="
            postman spec lint "$f"
          done
      - name: QA collection (against THIS commit's Orders code)
        run: |
          # Run the pushed Orders server locally so QA validates the new code,
          # not the currently-deployed API. A breaking change fails here and
          # blocks the deploy (the release job needs this job to pass).
          PORT=8787 node apis/orders/src/server.mjs &
          WPID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1 || { echo "::error::Orders API failed to start"; kill $WPID 2>/dev/null; exit 1; }
          # --bail stops at the FIRST failing request so the root cause isn't buried
          # under cascade failures (a broken Create nulls the id used by later tests).
          postman collection run "${{ env.ORDERS_QA_COLLECTION }}" --env-var "baseUrl=http://127.0.0.1:8787" --bail
          rc=$?
          kill $WPID 2>/dev/null || true
          exit $rc

  release:
    name: Sync to Cloud + Deploy to AWS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Sync local -> Postman Cloud (publish Cloud View)
        run: |
          set +e
          postman workspace prepare
          out=$(postman workspace push -y 2>&1); rc=$?
          echo "$out"
          [ $rc -eq 0 ] && exit 0
          # Non-zero exit: tolerate ONLY dataset failures (known 401 entitlement quirk —
          # datasets aren't writable via the CLI). Fail hard on any other resource error.
          fails=$(echo "$out" | grep 'Failed')
          nondataset=$(echo "$fails" | grep -vi 'dataset' | grep 'Failed')
          if [ -z "$fails" ] || [ -n "$nondataset" ]; then
            echo "::error::workspace push failed for critical resources (or unknown error)"
            exit 1
          fi
          echo "::warning::workspace push: only dataset(s) failed (known 401 quirk) — continuing"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to AWS (SSM → git pull + redeploy)
        run: |
          cat > /tmp/ssm.json <<'JSON'
          {"commands":["sudo -u ubuntu -H bash -lc 'cd ~/postman-api-catalog-demo && git pull -q && cd runtime-vm && ./deploy-runtime.sh'"]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file:///tmp/ssm.json \
            --comment "CI deploy ${{ github.sha }}" --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 40); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $S"
            case "$S" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::deploy failed"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_INSTANCE_ID" --query StandardOutputContent --output text | tail -20
      - name: Post-deploy smoke (QA against live AWS)
        run: |
          # confirm the deployed AWS API passes the same QA suite
          for i in $(seq 1 20); do curl -sf "https://$AWS_HOST/health" >/dev/null 2>&1 && break; sleep 4; done
          postman collection run "${{ env.ORDERS_QA_COLLECTION }}" -e "${{ env.AWS_ORDERS_ENV }}" --bail
