# Real CI/CD pipeline — Postman local (git) is the source of truth.
#   PR & push  : spec lint + QA + a performance load-test, ALL against the FRESHLY-BUILT
#                code in the runner (a breaking or slow change fails here → merge/deploy blocked)
#   push main  : after those pass, sync local->Postman Cloud, deploy to AWS, post-deploy smoke
#   Deploy only runs if BOTH the test gate and the performance gate pass
#                (release `needs: [test, performance]`).
#
# Requires: repo secret POSTMAN_API_KEY (already set). AWS access via GitHub OIDC
# (role github-actions-postman-deploy, no stored keys). See README.md.

name: API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  ORDERS_QA_COLLECTION: 53522859-54ec8184-2939-4cef-8528-56e1936bbae5
  ORDERS_PERF_COLLECTION: 53522859-252dae41-d1c6-4dcc-9907-0964eb173855   # Orders GET performance test
  AWS_ORDERS_ENV: 53522859-9577f7c6-d8c7-4375-bf19-85b17e418c33   # Orders Production (AWS)
  AWS_HOST: 18-157-170-15.nip.io
  AWS_REGION: eu-central-1
  AWS_INSTANCE_ID: i-0b7891fda81d7e646
  DEPLOY_ROLE: arn:aws:iam::005904641462:role/github-actions-postman-deploy
  # Performance gate (load test against the freshly-built code in the runner).
  PERF_VU_COUNT: "5"
  PERF_DURATION_MIN: "1"
  PERF_PASS_IF: "less_than(p99, 2000)"

jobs:
  test:
    name: Lint + QA (freshly-built code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm            # cache ~/.npm keyed on package-lock.json — fast repeat installs
      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Spec lint (local specs — the Spec Hub source of truth)
        run: |
          for f in orders.yaml payments.yaml users.yaml; do
            echo "== lint $f =="
            postman spec lint "$f"
          done
      - name: QA collection (against THIS commit's Orders code)
        run: |
          # Run the pushed Orders server locally so QA validates the new code,
          # not the currently-deployed API. A breaking change fails here and
          # blocks the deploy (the release job needs this job to pass).
          PORT=8787 node apis/orders/src/server.mjs &
          WPID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1 || { echo "::error::Orders API failed to start"; kill $WPID 2>/dev/null; exit 1; }
          # --bail stops at the FIRST failing request so the root cause isn't buried
          # under cascade failures (a broken Create nulls the id used by later tests).
          postman collection run "${{ env.ORDERS_QA_COLLECTION }}" --env-var "baseUrl=http://127.0.0.1:8787" --bail
          rc=$?
          kill $WPID 2>/dev/null || true
          exit $rc

  performance:
    name: Performance (load test — freshly-built code)
    needs: test
    # Runs on every event (PR, push to main, manual dispatch): always load-tests the
    # code being shipped, in the runner. On push to main it also gates the deploy
    # (release needs it). One job, one behaviour — nothing to explain twice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm            # cache ~/.npm keyed on package-lock.json — fast repeat installs
      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Load-test the freshly-built Orders code (localhost in the runner)
        run: |
          # Boot THIS commit's Orders server and load-test it, so a perf regression is
          # caught before merge/deploy — no load on prod. Runner-localhost numbers are
          # indicative, not capacity-grade; the p99 threshold is a smoke-level guard.
          # baseUrl comes from .github/perf-local.env.yaml (127.0.0.1:8787) — performance
          # run has no --env-var, so it reads baseUrl from that env file.
          PORT=8787 node apis/orders/src/server.mjs &
          WPID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1 || { echo "::error::Orders API failed to start"; kill $WPID 2>/dev/null; exit 1; }
          postman performance run "${{ env.ORDERS_PERF_COLLECTION }}" \
            -e .github/perf-local.env.yaml \
            --vu-count ${{ env.PERF_VU_COUNT }} \
            --duration ${{ env.PERF_DURATION_MIN }} \
            --load-profile fixed \
            --pass-if "${{ env.PERF_PASS_IF }}"
          rc=$?
          kill $WPID 2>/dev/null || true
          exit $rc

  release:
    name: Sync to Cloud + Deploy to AWS
    needs: [test, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Sync local -> Postman Cloud (publish Cloud View)
        run: |
          set +e
          postman workspace lint --fix || true   # auto-drop dangling resource refs (WSP014)
          postman workspace prepare
          out=$(postman workspace push -y 2>&1); rc=$?
          echo "$out"
          [ $rc -eq 0 ] && exit 0
          # Non-zero exit: tolerate ONLY dataset failures (known 401 entitlement quirk —
          # datasets aren't writable via the CLI). Fail hard on any other resource error.
          fails=$(echo "$out" | grep 'Failed')
          nondataset=$(echo "$fails" | grep -vi 'dataset' | grep 'Failed')
          if [ -z "$fails" ] || [ -n "$nondataset" ]; then
            echo "::error::workspace push failed for critical resources (or unknown error)"
            exit 1
          fi
          echo "::warning::workspace push: only dataset(s) failed (known 401 quirk) — continuing"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to AWS (SSM → fetch + redeploy)
        run: |
          # Self-healing pull on the VM: pin the anonymous public remote (the repo is
          # public — no creds needed; guards against a stale authenticated origin URL that
          # makes git prompt for a username under SSM's no-tty shell), force HTTP/1.1 to
          # dodge the "expected flush after ref listing" smart-HTTP/2 hiccup, disable the
          # credential prompt so it fails fast instead of hanging, retry transient blips,
          # then hard-reset to origin/main (VM only ever consumes main).
          cat > /tmp/ssm.json <<'JSON'
          {"commands":["sudo -u ubuntu -H bash -lc 'cd ~/postman-api-catalog-demo && git remote set-url origin https://github.com/davidespihernandez/postman-api-catalog-demo.git && git config --global http.version HTTP/1.1 && ( for i in 1 2 3; do GIT_TERMINAL_PROMPT=0 git fetch --quiet origin main && exit 0; sleep 5; done; exit 1 ) && git reset --hard --quiet origin/main && cd runtime-vm && ./deploy-runtime.sh'"]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file:///tmp/ssm.json \
            --comment "CI deploy ${{ github.sha }}" --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 40); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $S"
            case "$S" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::deploy failed"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_INSTANCE_ID" --query StandardOutputContent --output text | tail -20
      - name: Post-deploy smoke (QA against live AWS)
        run: |
          # confirm the deployed AWS API passes the same QA suite
          for i in $(seq 1 20); do curl -sf "https://$AWS_HOST/health" >/dev/null 2>&1 && break; sleep 4; done
          postman collection run "${{ env.ORDERS_QA_COLLECTION }}" -e "${{ env.AWS_ORDERS_ENV }}" --bail
